name: Bug report
description: Something isn't working
title: "[BUG] "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the issue
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour

  - type: markdown
    attributes:
      value: "## Environment"

  - type: dropdown
    id: client
    attributes:
      label: Client
      description: Select your client
      options:
        - Equicord
        - Vencord
        - BetterDiscord
        - Other
    validations:
      required: true

  - type: input
    id: client_other
    attributes:
      label: If "Other", specify your client
      placeholder: Type your client here

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS, Linux

  - type: input
    id: theme_version
    attributes:
      label: Theme Version
      placeholder: e.g. v7.2.0, latest, or custom build

  - type: input
    id: discord_version
    attributes:
      label: Discord Version (if known)

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots

  - type: textarea
    id: extra
    attributes:
      label: Additional Context

  - type: markdown
    attributes:
      value: |
        ---
        ⏳ Please be patient — responses may take time.
        For faster help: https://rb.ash1421.com/discord
